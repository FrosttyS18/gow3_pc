name: launcher-contract

# Testes FUNDAMENTAIS de interface (não visuais) — o mantenedor avalia
# aparência, hover, fontes, cores e animações manualmente.
# Este check valida: abertura de páginas, ausência de crashes/exceções React,
# rotas distintas (Patches≠Mods), Música como ação.
#
# Sem filtro `paths` — check obrigatório emite em TODOS os PRs.
# Token somente leitura; sem segredos; sem pull_request_target.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: launcher contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: launcher/cinematic
        run: npm install

      - name: Install Playwright Chromium
        working-directory: launcher/cinematic
        run: npx playwright install chromium --with-deps

      - name: Build frontend (TypeScript check)
        working-directory: launcher/cinematic
        run: npm run build

      - name: Run contract tests
        working-directory: launcher/cinematic
        run: npx playwright test
