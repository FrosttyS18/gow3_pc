name: launcher-contract

# CAMADA A: testes de contrato do launcher em Chromium headless (CI executável).
# CAMADA B: testes Tauri/WebView2 real (test_ui.py) — executados localmente em
# Windows compatível; NÃO substituídos por mocks.
#
# Este check NÃO usa filtro `paths` — um check destinado a ser obrigatório
# precisa emitir resultado em TODOS os PRs, mesmo quando o frontend não muda,
# para evitar estados pendentes que bloqueiam merges.
#
# Token somente leitura; sem segredos; sem pull_request_target; sem execução
# de código do PR em contexto privilegiado.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: launcher contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run contract tests (Layer A — headless)
        working-directory: launcher/cinematic
        run: |
          npm install
          npx playwright test tests/test_contract.mjs --reporter=line
        env:
          CI: 'true'

      - name: Report Layer B status (informational)
        run: |
          echo "Layer B (Tauri/WebView2 real) tests: run locally on Windows"
          echo "  python launcher/cinematic/tests/test_ui.py"
          echo "These tests are NOT replaced by mocks; they validate native integration."
