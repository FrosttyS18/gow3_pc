name: launcher-contract

# Testes FUNDAMENTAIS do launcher cinematográfico (não visuais).
# O mantenedor avalia aparência, hover, fontes, cores e animações manualmente.
#
# Este check valida:
# 1. Build TypeScript/Vite (captura erros de React, imports, hooks, tipos)
# 2. Estrutura do contrato (9 páginas + Música, IDs imutáveis)
#
# Os testes de ponte (test_bridge.py, 23 verificações) e de janela Tauri real
# (test_ui.py, 34 verificações) são executados localmente em Windows — ver PR.
#
# Sem filtro `paths` — check obrigatório emite em TODOS os PRs.
# Token somente leitura; sem segredos; sem pull_request_target.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: launcher contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (TypeScript strict + Vite)
        working-directory: launcher/cinematic
        run: |
          npm install
          npm run build

      - name: Verify contract structure (9 pages + Música action)
        working-directory: launcher/cinematic
        run: |
          node -e "
            const fs = require('fs');
            const nav = fs.readFileSync('src/components/NavMenu.tsx', 'utf8');
            const pages = ['display','graphics','performance','game','patches','mods','controls','advanced','log'];
            for (const p of pages) {
              if (!nav.includes('\"' + p + '\"')) {
                console.error('MISSING page ID: ' + p);
                process.exit(1);
              }
            }
            if (!nav.includes('music-toggle')) {
              console.error('MISSING Música action button');
              process.exit(1);
            }
            if (nav.includes('Mods & patches')) {
              if (nav.match(/Mods & patches/g)?.length > 1) {
                console.error('DUPLICATE: Mods & patches used for multiple routes');
                process.exit(1);
              }
            }
            console.log('Contract structure: 9 pages + Música ✓');
          "

      - name: Verify bridge contract (bridge_bridge.py compiles + has all commands)
        working-directory: launcher/cinematic
        run: |
          python3 -c "
            import sys; sys.path.insert(0, '../../launcher'); sys.path.insert(0, '../../scripts')
            import py_compile
            py_compile.compile('bridge/launcher_bridge.py', doraise=True)
            source = open('bridge/launcher_bridge.py').read()
            for cmd in ['state','set_ini','set_app','play','play_status','patches_state',
                        'mods_state','controls_state','backups_list','backup_restore',
                        'clear_cache','update_check','log_read']:
                if f'\"{cmd}\"' not in source:
                    print(f'MISSING bridge command: {cmd}'); sys.exit(1)
            print('Bridge contract: all 13 commands present ✓')
          "
